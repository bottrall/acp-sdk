plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/RedundantLineBreak:
  Enabled: true
  InspectBlocks: false

Metrics:
  Enabled: false

Metrics/BlockNesting:
  Enabled: true

Minitest/MultipleAssertions:
  Max: 1

Style/ClassAndModuleChildren:
  EnforcedStyle: compact

Style/Documentation:
  Enabled: false

Style/ModuleFunction:
  EnforcedStyle: extend_self

Naming/MethodParameterName:
  Exclude:
    # Parameter names come from the schema's property names.
    - "lib/acp/types/**/*"

Naming/AccessorMethodName:
  Exclude:
    # Agent methods mirror the protocol's session/set_mode and
    # session/set_config_option requests; they are not attribute writers.
    - "test/acp/agent_connection_test.rb"
