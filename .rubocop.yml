plugins:
  - rubocop-bottrall

inherit_gem:
  rubocop-bottrall:
    - config/base.yml
    - config/rbs-inline.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.4

Naming/MethodParameterName:
  Exclude:
    # Parameter names come from the schema's property names.
    - "lib/acp/types/**/*"

Bottrall/NoMocking:
  OwnedNamespaces:
    - ACP
