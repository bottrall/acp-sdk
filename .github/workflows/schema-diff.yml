# Summarises a schema change for whoever reviews it. It reports rather than
# gates: the method coverage tests are what fail on an unhandled method.

name: schema-diff

on:
  pull_request:
    paths:
      - "schema/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-diff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull_request checkout is the merge commit, so depth 2 fetches
          # HEAD^1, the base it merges into.
          fetch-depth: 2
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
      - run: |
          git archive HEAD^1 schema | tar -x -C "$RUNNER_TEMP"
          bin/diff-schema "$RUNNER_TEMP/schema" >> "$GITHUB_STEP_SUMMARY"
