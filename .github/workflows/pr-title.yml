# PR titles become the squash commit on main, and release-please reads them as
# conventional commits to pick the version bump and write the changelog.

name: pr-title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
