version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10
    groups:
      guard:
        patterns: ["guard*"]
      rubocop:
        patterns: ["rubocop*"]
      types:
        patterns: ["rbs*", "steep"]
      development:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
